name: Daily Board Scraper

on:
  schedule:
    # Runs at 3:00 AM UTC (8:00 AM PKT) every day
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows you to run it manually by clicking a button

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: pip install requests beautifulsoup4 paramiko

      - name: Run Scraper
        # Your python script should save the file into a folder named "output"
        run: python scraper.py

      - name: Upload JSON to Middlehost via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./output/
          server-dir: ./
