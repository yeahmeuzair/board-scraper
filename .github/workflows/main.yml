name: Daily Board Scraper

on:
  schedule:
    # Runs at 3:00 AM UTC (8:00 AM PKT) every day
    - cron: '0 3 * * *'
  workflow_dispatch: # This allows you to run it manually by clicking a button

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: |
          pip install requests beautifulsoup4

      - name: Run Scraper
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python scraper.py
